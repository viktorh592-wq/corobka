name: korobka
description: "Десктопное приложение для Windows — полноценный аналог Eagle: сбор и структурированное хранение коллекции скриншотов"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Управление путями к файлам и файловой системой
  path: ^1.8.3
  path_provider: ^2.1.1
  file_picker: ^6.1.1

  # Хранение данных. sqflite_common_ffi необходим для работы на десктопе (Windows)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.2.2

  # Извлечение цветовой палитры и метаданных изображений
  image: ^4.1.3
  palette_generator: ^0.3.3+3

  # Управление состоянием
  provider: ^6.1.1

  # Drag-and-drop файлов в окно
  desktop_drop: ^0.4.4

  # Типы для drag-and-drop (XFile) и обмена файлами
  cross_file: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
