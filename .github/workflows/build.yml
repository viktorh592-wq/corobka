name: build-windows

on:
  workflow_dispatch:        # ручной запуск из веб-интерфейса
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Windows project
        run: flutter create --platforms=windows --org com.example .

      - name: Install dependencies
        run: flutter pub get

      - name: Provide sqlite3.dll for FFI tests
        shell: pwsh
        run: |
          # Тесты используют sqflite_common_ffi, которому на Windows нужен
          # sqlite3.dll. Скачиваем официальную сборку и добавляем в PATH,
          # чтобы DynamicLibrary.open('sqlite3.dll') нашёл библиотеку.
          $ver = "3450100"
          $url = "https://www.sqlite.org/2024/sqlite-dll-win-x64-$ver.zip"
          $out = "$env:RUNNER_TEMP\sqlite3"
          Invoke-WebRequest -Uri $url -OutFile "$out.zip"
          Expand-Archive -Path "$out.zip" -DestinationPath $out -Force
          Add-Content $env:GITHUB_PATH $out

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: korobka-windows
          path: build/windows/x64/runner/Release/
